<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 中山分隊受理災害登記簿登打輔助系統</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, "Microsoft JhengHei", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        /* 左右雙欄響應式排版：讓左側稍窄、右側結果區更寬敞 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 20px;
            align-items: start;
        }

        /* 當螢幕小於 1024px 時自動變為單欄 */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .sticky-column {
                position: static !important;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* 右側欄位固定懸浮 */
        .sticky-column {
            position: sticky;
            top: 16px;
        }

        .section-group {
            background: var(--card-bg);
            padding: 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .section-group:hover {
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04);
        }

        .section-group h3 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 15px;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 網格排列：車輛與人員選擇區 */
        .grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px;
        }

        /* 隱藏原生 checkbox，改由卡片本身作為選取元件 */
        .checkbox-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 13px;
            user-select: none;
            text-align: center;
            color: var(--text-main);
        }

        .checkbox-card input {
            display: none;
        }

        .checkbox-card:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }

        /* 點選後反藍樣式 */
        .checkbox-card.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        /* 表單欄位 */
        .flex-row {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .flex-row {
                flex-direction: column;
            }
        }

        .flex-col {
            flex: 1;
        }

        label.field-label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 9px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 職稱標籤 */
        .category-badge {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .category-badge:first-of-type {
            margin-top: 0;
        }

        /* 放大後的輸出結果區塊 */
        .output-box {
            background: #1e293b;
            color: #f8fafc;
            border: none;
            padding: 18px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.7;
            min-height: 280px; /* 增加高度，使結果區塊顯得更大更寬敞 */
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(37, 99, 235, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 中山分隊受理災害登記簿登打輔助系統</h2>

    <div class="main-layout">
        <!-- 左側欄位：1, 2, 3 區塊 -->
        <div class="column">
            <!-- 基本資訊區 -->
            <div class="section-group">
                <h3>📍 1. 基本案件資訊</h3>
                <div class="flex-row" style="margin-bottom: 10px;">
                    <div class="flex-col">
                        <label class="field-label">案件地址</label>
                        <input type="text" id="address" value="" placeholder="請輸入案件地址" oninput="updateOutput()">
                    </div>
                    <div class="flex-col">
                        <label class="field-label">案件類別</label>
                        <input type="text" id="dutyType" value="" placeholder="請輸入案件類別" oninput="updateOutput()">
                    </div>
                </div>
                <div>
                    <label class="field-label">處理情形</label>
                    <input type="text" id="statusNote" value="" placeholder="請輸入處理情形" oninput="updateOutput()">
                </div>
            </div>

            <!-- 車輛點選區 -->
            <div class="section-group">
                <h3>🚒 2. 出勤車輛 (可複選)</h3>
                <div id="carList" class="grid-options">
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="11車"> 11車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="12車"> 12車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="16車"> 16車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="33車"> 33車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="41車"> 41車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="42車"> 42車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="43車"> 43車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="51車"> 51車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="61車"> 61車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="91車"> 91車</label>
                    <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" value="92車"> 92車</label>
                </div>
            </div>

            <!-- 人員點選區 -->
            <div class="section-group">
                <h3>👨‍🚒 3. 出勤人員 (可複選)</h3>
                
                <div>
                    <span class="category-badge">分隊長</span>
                    <div class="grid-options">
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="分隊長" value="歐顯孝"> 歐顯孝</label>
                    </div>
                </div>

                <div>
                    <span class="category-badge">小隊長</span>
                    <div class="grid-options">
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="曾世璿"> 曾世璿</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="楊春長"> 楊春長</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="黃健閔"> 黃健閔</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="蔡昇志"> 蔡昇志</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="吳柏佑"> 吳柏佑</label>
                    </div>
                </div>

                <div>
                    <span class="category-badge">隊員</span>
                    <div class="grid-options">
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="謝咏勲"> 謝咏勲</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="施智偉"> 施智偉</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖唯伸"> 廖唯伸</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="施明谷"> 施明谷</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="游登翔"> 游登翔</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="林育豪"> 林育豪</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="范庭嘉"> 范庭嘉</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="吳康豪"> 吳康豪</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="古奇峯"> 古奇峯</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="侯鈞婷"> 侯鈞婷</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="魏志宇"> 魏志宇</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="蔡侑築"> 蔡侑築</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="盧功榮"> 盧功榮</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="華昱銘"> 華昱銘</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖延宗"> 廖延宗</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="劉羽程"> 劉羽程</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="王柏翔"> 王柏翔</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="蘇信衡"> 蘇信衡</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="黃榮祥"> 黃榮祥</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="來祐興"> 來祐興</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="陳建銘"> 陳建銘</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="陳俞霈"> 陳俞霈</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="林峰玉"> 林峰玉</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="李佳陽"> 李佳陽</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="林晨賢"> 林晨賢</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="吳晟豪"> 吳晟豪</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖晟翔"> 廖晟翔</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="洪祥倫"> 洪祥倫</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖芳瑜"> 廖芳瑜</label>
                        <label class="checkbox-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="施冠宇"> 施冠宇</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側欄位：4. 放大後的產出文字結果 (Sticky) -->
        <div class="column sticky-column">
            <div class="section-group">
                <h3>📋 4. 產出文字結果</h3>
                <div id="outputBox" class="output-box"></div>
                <button class="btn" onclick="copyText()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    一鍵複製文字
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// 點擊整張卡片切換選取狀態與反藍樣式
function toggleCard(card) {
    const checkbox = card.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
        card.classList.add('checked');
    } else {
        card.classList.remove('checked');
    }
    
    updateOutput();
}

function updateOutput() {
    const address = document.getElementById('address').value;
    const dutyType = document.getElementById('dutyType').value;
    const statusNote = document.getElementById('statusNote').value;

    // 收集車輛
    const carCheckboxes = document.querySelectorAll('#carList input[type="checkbox"]:checked');
    let carsArr = Array.from(carCheckboxes).map(chk => chk.value.replace('車',''));
    let carsStr = carsArr.length > 0 ? carsArr.join('、') + '車' : '';

    // 收集人員並依照職稱群組化
    const personCheckboxes = document.querySelectorAll('.person-chk:checked');
    let grouped = {};
    
    personCheckboxes.forEach(chk => {
        let title = chk.getAttribute('data-title');
        let name = chk.value;
        if (!grouped[title]) {
            grouped[title] = [];
        }
        grouped[title].push(name);
    });

    let groupStrs = [];
    ['分隊長', '小隊長', '隊員'].forEach(title => {
        if (grouped[title] && grouped[title].length > 0) {
            groupStrs.push(title + grouped[title].join('、'));
        }
    });

    let personsStr = groupStrs.length > 0 ? groupStrs.join('，') + '。' : '。';

    let resultText = `中山分隊處理情形：\n一、至${address}執行${dutyType}。\n二、${statusNote}。\n三、出勤車輛:${carsStr}。\n四、出勤人員:${personsStr}`;

    document.getElementById('outputBox').innerText = resultText;
}

function copyText() {
    const outputBox = document.getElementById('outputBox');
    navigator.clipboard.writeText(outputBox.innerText).then(() => {
        const btn = document.querySelector('.btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✨ 複製成功！';
        btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = '';
        }, 1500);
    });
}

window.onload = updateOutput;
</script>

</body>
</html>
