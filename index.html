<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 中山分隊受理災害登記簿登打輔助系統</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-light: #eff6ff;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --warning: #f97316;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-pill: 999px;
        }

        body {
            font-family: "SF Pro TC", "SF Pro Text", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 0; 
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* 針對 2K (2560px) 螢幕調整容器最大寬度 */
        .container {
            width: 96%; 
            max-width: 2500px; 
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* 左右雙欄響應式排版，適應超寬螢幕 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr minmax(500px, 700px);
            gap: 40px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .sticky-column {
                position: static !important;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 28px;
            min-width: 0;
        }

        .sticky-column {
            position: sticky;
            top: 40px;
        }

        /* 基礎區塊共用樣式 */
        .section-group {
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .section-group:hover {
            box-shadow: 0 12px 20px -3px rgba(0,0,0,0.08);
        }

        .section-group::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
        }

        .section-group h3 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 19px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        /* 左側色彩識別標籤 */
        .section-info::before { background-color: var(--warning); }
        .section-car::before { background-color: var(--danger); }
        .section-person::before { background-color: var(--primary); }
        .section-output::before { background-color: #8b5cf6; } 

        /* 表單與輸入框 */
        .flex-row { display: flex; gap: 20px; align-items: flex-start; }
        .flex-col { flex: 1; }
        @media (max-width: 600px) { .flex-row { flex-direction: column; } }

        label.field-label {
            display: block;
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            box-sizing: border-box;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 16px;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--warning);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        /* 快速預設按鈕 (Quick-fill) */
        .preset-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .preset-btn {
            font-size: 14px;
            padding: 6px 14px;
            background: #f1f5f9;
            color: var(--text-muted);
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            border: 1px solid transparent;
            font-weight: 500;
        }

        .preset-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
            border-color: #cbd5e1;
        }

        .preset-btn:active {
            transform: scale(0.95);
        }

        /* 膠囊按鈕群組 (車輛/人員) */
        .grid-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .checkbox-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border: 1.5px solid transparent;
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            font-weight: 500;
            user-select: none;
            color: var(--text-muted);
        }

        .checkbox-card input {
            display: none;
        }

        .checkbox-card:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        /* 車輛：選取狀態 */
        .car-card.checked {
            background: var(--danger-light);
            border-color: #fca5a5;
            color: var(--danger);
            font-weight: 700;
        }

        /* 人員：選取狀態 */
        .person-card.checked {
            background: var(--primary-light);
            border-color: #bfdbfe;
            color: var(--primary);
            font-weight: 700;
        }

        /* 職稱標籤 */
        .category-badge {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: block;
            margin-top: 24px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .category-group:first-child .category-badge { margin-top: 0; }

        /* 產出結果區塊 */
        .output-box {
            background: #f8fafc;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius-md);
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 18px; 
            line-height: 1.8;
            min-height: 300px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        .btn {
            width: 100%;
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }
        
        .btn.success {
            background: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        /* 針對 2K 解析度以上 (>= 1920px) 額外微調字體 */
        @media (min-width: 1920px) {
            h2 { font-size: 32px; }
            .output-box { font-size: 20px; line-height: 2; }
            .checkbox-card { font-size: 16px; padding: 12px 24px; }
        }
    </style>
</head>
<body>

    <div class="main-layout">

                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="黃健閔"> 黃健閔</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="蔡昇志"> 蔡昇志</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="吳柏佑"> 吳柏佑</label>

                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖唯伸"> 廖唯伸</label>

                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="吳康豪"> 吳康豪</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="古奇峯"> 古奇峯</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="侯鈞婷"> 侯鈞婷</label>

<script>
// 點擊快速預設按鈕，將文字填入指定輸入框並更新結果
function quickFill(elementId, text) {
    const inputEl = document.getElementById(elementId);
    inputEl.value = text;
    
    // 加上簡單的閃爍特效提示已填入
    inputEl.style.transition = 'background 0.2s';
    inputEl.style.background = '#ffedd5';
    setTimeout(() => {
        inputEl.style.background = '#ffffff';
    }, 300);

    updateOutput();
}

// 點擊整張卡片切換選取狀態
function toggleCard(card) {
    const checkbox = card.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
        card.classList.add('checked');
    } else {
        card.classList.remove('checked');
    }
    
    updateOutput();
}

// 防呆處理與文字產出
function updateOutput() {
    const address = document.getElementById('address').value.trim() || '___';
    const dutyType = document.getElementById('dutyType').value.trim() || '___';
    const statusNote = document.getElementById('statusNote').value.trim() || '___';

    // 收集車輛
    const carCheckboxes = document.querySelectorAll('#carList input[type="checkbox"]:checked');
    let carsArr = Array.from(carCheckboxes).map(chk => chk.value.replace('車',''));
    let carsStr = carsArr.length > 0 ? carsArr.join('、') + '車' : '無';

    // 收集人員並依照職稱群組化
    const personCheckboxes = document.querySelectorAll('.person-chk:checked');
    let grouped = {};
    
    personCheckboxes.forEach(chk => {
        let title = chk.getAttribute('data-title');
        let name = chk.value;
        if (!grouped[title]) {
            grouped[title] = [];
        }
        grouped[title].push(name);
    });

    let groupStrs = [];
    ['分隊長', '小隊長', '隊員'].forEach(title => {
        if (grouped[title] && grouped[title].length > 0) {
            groupStrs.push(title + grouped[title].join('、'));
        }
    });

    let personsStr = groupStrs.length > 0 ? groupStrs.join('，') + '。' : '無。';

    let resultText = `中山分隊處理情形：\n一、至${address}執行${dutyType}。\n二、${statusNote}。\n三、出勤車輛:${carsStr}。\n四、出勤人員:${personsStr}`;

    const outputBox = document.getElementById('outputBox');
    outputBox.innerText = resultText;
    
    // 給予輕微的文字閃爍動畫提示更新
    outputBox.style.opacity = '0.5';
    setTimeout(() => { outputBox.style.opacity = '1'; }, 100);
}

// 複製與按鈕動畫反饋
function copyText() {
    const outputBox = document.getElementById('outputBox');
    navigator.clipboard.writeText(outputBox.innerText).then(() => {
        const btn = document.getElementById('copyBtn');
        const originalContent = btn.innerHTML;
        
        btn.classList.add('success');
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> 複製成功！`;
        
        setTimeout(() => {
            btn.classList.remove('success');
            btn.innerHTML = originalContent;
        }, 2000);
    });
}

// 初始載入時更新一次
window.onload = updateOutput;
</script>
