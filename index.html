<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 中山分隊案件處理情形 登打輔助系統</title>
    <style>
        /* 現代化色彩變數 */
        :root {
            /* 橘黃色系 (基本資訊) */
            --info-main: #f59e0b;
            --info-light: #fffbeb;
            --info-border: #fcd34d;
            --info-ring: rgba(245, 158, 11, 0.2);

            /* 紅色系 (車輛) */
            --car-main: #ef4444;
            --car-light: #fef2f2;
            --car-border: #fca5a5;
            --car-ring: rgba(239, 68, 68, 0.2);

            /* 藍色系 (人員) */
            --person-main: #3b82f6;
            --person-light: #eff6ff;
            --person-border: #bfdbfe;
            --person-ring: rgba(59, 130, 246, 0.2);

            /* 綠色系 (分隊初報) */
            --out1-main: #10b981;
            --out1-light: #ecfdf5;
            --out1-border: #a7f3d0;
            --out1-ring: rgba(16, 185, 129, 0.2);

            /* 紫色系 (分隊結報) */
            --out2-main: #8b5cf6;
            --out2-light: #faf5ff;
            --out2-border: #ddd6fe;
            --out2-ring: rgba(139, 92, 246, 0.2);

            /* 粉紅色系 (處理情形) */
            --out3-main: #ec4899;
            --out3-light: #fdf2f8;
            --out3-border: #fbcfe8;
            --out3-ring: rgba(236, 72, 153, 0.2);
            
            /* 中性色系 */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            /* 圓角與陰影 */
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-pill: 999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
            --shadow-hover: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        body {
            font-family: "SF Pro TC", "SF Pro Text", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            padding: 30px 0 60px 0; 
            box-sizing: border-box;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 針對 2K 顯示器最佳化的寬度設定 */
        .container {
            width: 98%; 
            max-width: 2560px; /* 完美匹配 2K 解析度寬度 */
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-title h2 {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 12px 28px;
            background: var(--card-bg);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .main-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            align-items: start;
        }

        @media (max-width: 1200px) {
            .main-layout { grid-template-columns: 1fr; }
            .sticky-column { position: static !important; max-height: none !important; }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 28px;
            min-width: 0;
        }

        /* 右側滾動條美化 */
        .sticky-column {
            position: sticky;
            top: 24px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
            padding-right: 8px;
        }
        .sticky-column::-webkit-scrollbar { width: 6px; }
        .sticky-column::-webkit-scrollbar-track { background: transparent; }
        .sticky-column::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: var(--radius-pill);
        }
        .sticky-column::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

        /* 區塊共用樣式 */
        .section-group {
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
        }
        .section-group:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .section-group::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 6px;
        }

        /* 主題色系設定 - 左/中區 */
        .section-info { background-color: var(--info-light); border: 1px solid var(--info-border); }
        .section-info::before { background-color: var(--info-main); }
        
        .section-car { background-color: var(--car-light); border: 1px solid var(--car-border); }
        .section-car::before { background-color: var(--car-main); }
        
        .section-person { background-color: var(--person-light); border: 1px solid var(--person-border); }
        .section-person::before { background-color: var(--person-main); }
        
        /* 主題色系設定 - 右區獨立產出 */
        .section-out1 { background-color: var(--out1-light); border: 1px solid var(--out1-border); }
        .section-out1::before { background-color: var(--out1-main); }
        
        .section-out2 { background-color: var(--out2-light); border: 1px solid var(--out2-border); }
        .section-out2::before { background-color: var(--out2-main); }

        .section-out3 { background-color: var(--out3-light); border: 1px solid var(--out3-border); }
        .section-out3::before { background-color: var(--out3-main); }

        .section-group h3 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            border-bottom: 2px dashed rgba(0,0,0,0.06);
            padding-bottom: 16px;
        }

        /* 數字統計標籤 */
        .count-badge {
            margin-left: auto;
            color: white;
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 700;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 2px 5px rgba(0,0,0,0.1);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .count-badge.car { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .count-badge.person { background: linear-gradient(135deg, #3b82f6, #2563eb); }

        /* 表單元素 */
        label.field-label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="datetime-local"] {
            width: 100%;
            padding: 14px 18px;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-size: 16px;
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }

        .section-info input:focus { border-color: var(--info-main); box-shadow: 0 0 0 4px var(--info-ring); outline: none; }

        /* 預設按鈕 (標籤) */
        .preset-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .preset-btn {
            font-size: 14px;
            padding: 6px 16px;
            background: #ffffff;
            color: var(--text-muted);
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            border: 1px solid var(--border-color);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }
        .preset-btn:hover {
            color: var(--info-main);
            border-color: var(--info-main);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(245, 158, 11, 0.1);
        }
        .preset-btn:active { transform: scale(0.95); }

        /* 膠囊按鈕群組 */
        .grid-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .checkbox-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 2px solid var(--border-color);
            padding: 10px 22px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            font-weight: 600;
            user-select: none;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
        }
        .checkbox-card input { display: none; }
        
        .checkbox-card:hover {
            border-color: #94a3b8;
            color: var(--text-main);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .checkbox-card:active { transform: scale(0.96); }

        .car-card.checked {
            background: var(--car-main);
            border-color: var(--car-main);
            color: white;
            box-shadow: 0 4px 12px var(--car-ring);
        }
        
        .person-card.checked {
            background: var(--person-main);
            border-color: var(--person-main);
            color: white;
            box-shadow: 0 4px 12px var(--person-ring);
        }

        .category-badge {
            font-size: 13px;
            font-weight: 800;
            color: var(--person-main);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-block;
            margin-top: 24px;
            margin-bottom: 14px;
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 6px;
        }
        .category-group:first-child .category-badge { margin-top: 0; }

        /* 產出結果區塊文字框 */
        .output-box {
            background: #ffffff;
            color: var(--text-main);
            padding: 20px;
            border-radius: var(--radius-lg);
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, "Cascadia Code", Menlo, Monaco, Consolas, monospace;
            font-size: 16px; 
            line-height: 1.7;
            min-height: 80px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }

        /* 個別產出框的邊框顏色 */
        .section-out1 .output-box { border: 2px solid var(--out1-border); }
        .section-out2 .output-box { border: 2px solid var(--out2-border); }
        .section-out3 .output-box { border: 2px solid var(--out3-border); }

        /* 標題列的一鍵複製按鈕共用樣式 */
        .copy-header-btn {
            margin-left: auto;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .copy-header-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        .copy-header-btn:active { 
            transform: translateY(0) scale(0.96); 
        }

        /* 獨立按鈕顏色 */
        .section-out1 .copy-header-btn {
            background: linear-gradient(135deg, var(--out1-main), #059669);
            box-shadow: 0 4px 12px var(--out1-ring);
        }
        .section-out1 .copy-header-btn:hover { box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35); }

        .section-out2 .copy-header-btn {
            background: linear-gradient(135deg, var(--out2-main), #7c3aed);
            box-shadow: 0 4px 12px var(--out2-ring);
        }
        .section-out2 .copy-header-btn:hover { box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35); }

        .section-out3 .copy-header-btn {
            background: linear-gradient(135deg, var(--out3-main), #be185d);
            box-shadow: 0 4px 12px var(--out3-ring);
        }
        .section-out3 .copy-header-btn:hover { box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35); }

        /* 複製成功的共用樣式 */
        .copy-header-btn.success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>📋 中山分隊案件處理情形 登打輔助系統</h2>
    </div>

    <div class="main-layout">
        <!-- 左區：基本案件資訊 -->
        <div class="column">
            <div class="section-group section-info">
                <h3>1. 📍 基本案件資訊</h3>
                
                <div style="margin-bottom: 24px;">
                    <label class="field-label">案件時間</label>
                    <input type="datetime-local" id="caseTime" onchange="updateOutput()">
                </div>

                <div style="margin-bottom: 24px;">
                    <label class="field-label">案件地址</label>
                    <input type="text" id="address" value="" placeholder="請輸入案件地址..." oninput="updateOutput()">
                    <!-- 案件地址快速按鈕 -->
                    <div class="preset-group">
                        <span class="preset-btn" onclick="quickFill('address', '太平區')">太平區</span>
                        <span class="preset-btn" onclick="quickFill('address', '北屯區')">北屯區</span>
                        <span class="preset-btn" onclick="quickFill('address', '北區')">北區</span>
                        <span class="preset-btn" onclick="quickFill('address', '東區')">東區</span>
                        <span class="preset-btn" onclick="quickFill('address', '中區')">中區</span>
                        <span class="preset-btn" onclick="quickFill('address', '西區')">西區</span>
                        <span class="preset-btn" onclick="quickFill('address', '大里區')">大里區</span>
                    </div>
                </div>

                <div style="margin-bottom: 24px;">
                    <label class="field-label">案件類別</label>
                    <input type="text" id="dutyType" value="" placeholder="例如：火警、救護..." oninput="updateOutput()">
                    <div class="preset-group">
                        <span class="preset-btn" onclick="quickFill('dutyType', '住宅火警')">住宅火警</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '工廠火警')">工廠火警</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '雜草火警')">雜草火警</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '電線桿火警')">電線桿火警</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '災害搶救')">災害搶救</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '瓦斯外洩')">瓦斯外洩</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '車禍救助')">車禍救助</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '破門救助')">破門救助</span>
                        <span class="preset-btn" onclick="quickFill('dutyType', '電梯受困')">電梯受困</span>
                    </div>
                </div>

                <div>
                    <label class="field-label">處理情形</label>
                    <input type="text" id="statusNote" value="" placeholder="請簡述處理情形..." oninput="updateOutput()">
                    <div class="preset-group">
                        <span class="preset-btn" onclick="quickFill('statusNote', '中途取消')">中途取消</span>
                        <span class="preset-btn" onclick="quickFill('statusNote', '警報器誤動作')">警報器誤動作</span>
                        <span class="preset-btn" onclick="quickFill('statusNote', '現場為誤報')">現場為誤報</span>
                        <span class="preset-btn" onclick="quickFill('statusNote', '民眾已自行撲滅')">民眾已自行撲滅</span>
                        <span class="preset-btn" onclick="quickFill('statusNote', 'RIT小組現場待命')">RIT小組現場待命</span>
                        <span class="preset-btn" onclick="quickFill('statusNote', '協助脫困後確認無須送醫')">協助脫困後確認無須送醫</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中區：出勤車輛與出勤人員 -->
        <div class="column">
            <!-- 區塊二：出勤車輛 -->
            <div class="section-group section-car">
                <h3>
                    2. 🚒 出勤車輛 
                    <span style="font-size: 14px; color: var(--text-muted); font-weight: normal;">(可複選)</span>
                    <span id="carCountBadge" class="count-badge car">0 車</span>
                </h3>
                <div id="carList" class="grid-options">
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="11車"> 11車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="12車"> 12車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="16車"> 16車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="33車"> 33車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="41車"> 41車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="42車"> 42車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="43車"> 43車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="51車"> 51車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="61車"> 61車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="91車"> 91車</label>
                    <label class="checkbox-card car-card" onclick="toggleCard(this)"><input type="checkbox" value="92車"> 92車</label>
                </div>
            </div>

            <!-- 區塊三：出勤人員 -->
            <div class="section-group section-person">
                <h3>
                    3. 👨‍🚒 出勤人員 
                    <span style="font-size: 14px; color: var(--text-muted); font-weight: normal;">(可複選)</span>
                    <span id="personCountBadge" class="count-badge person">0 人</span>
                </h3>
                
                <div class="category-group">
                    <span class="category-badge">分隊長</span>
                    <div class="grid-options">
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="分隊長" value="歐顯孝"> 歐顯孝</label>
                    </div>
                </div>

                <div class="category-group">
                    <span class="category-badge">小隊長</span>
                    <div class="grid-options">
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="楊春長"> 楊春長</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="曾世璿"> 曾世璿</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="黃健閔"> 黃健閔</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="蔡昇志"> 蔡昇志</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="小隊長" value="吳柏佑"> 吳柏佑</label>
                    </div>
                </div>

                <div class="category-group">
                    <span class="category-badge">隊員</span>
                    <div class="grid-options">
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="謝咏勲"> 謝咏勲</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="施智偉"> 施智偉</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="廖唯伸"> 廖唯伸</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="施明谷"> 施明谷</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="游登翔"> 游登翔</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="林育豪"> 林育豪</label>
                        <label class="checkbox-card person-card" onclick="toggleCard(this)"><input type="checkbox" class="person-chk" data-title="隊員" value="范庭嘉"> 范庭嘉</label>

<script>
// 初始化時設定預設時間為「現在時間」
function initCaseTime() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(now - offset)).toISOString().slice(0, 16);
    document.getElementById('caseTime').value = localISOTime;
}

// 將 datetime-local 轉換為民國年格式
function formatTaiwanTime(dateString) {
    if (!dateString) return '___';
    const dateObj = new Date(dateString);
    if (isNaN(dateObj.getTime())) return '___';
    
    const twYear = dateObj.getFullYear() - 1911;
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    const hours = String(dateObj.getHours()).padStart(2, '0');
    const minutes = String(dateObj.getMinutes()).padStart(2, '0');
    
    return `${twYear}年${month}月${day}日${hours}時${minutes}分`;
}

// 快速輸入按鈕微動畫與填入
function quickFill(elementId, text) {
    const inputEl = document.getElementById(elementId);
    inputEl.value = text;
    
    inputEl.style.transition = 'all 0.2s ease';
    inputEl.style.transform = 'scale(1.02)';
    inputEl.style.boxShadow = '0 0 0 4px rgba(245, 158, 11, 0.3)';
    
    setTimeout(() => {
        inputEl.style.transform = 'scale(1)';
        inputEl.style.boxShadow = 'var(--shadow-sm)';
    }, 200);

    updateOutput();
}

// 切換選取狀態
function toggleCard(card) {
    const checkbox = card.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
        card.classList.add('checked');
    } else {
        card.classList.remove('checked');
    }
    
    updateOutput();
}

// 文字與數字更新
function updateOutput() {
    const rawTime = document.getElementById('caseTime').value;
    const caseTime = formatTaiwanTime(rawTime);
    const address = document.getElementById('address').value.trim() || '___';
    const dutyType = document.getElementById('dutyType').value.trim() || '___';
    const statusNote = document.getElementById('statusNote').value.trim() || '___';

    const carCheckboxes = document.querySelectorAll('#carList input[type="checkbox"]:checked');
    let carCount = carCheckboxes.length;
    let carsArr = Array.from(carCheckboxes).map(chk => chk.value.replace('車',''));
    let carsStr = carsArr.length > 0 ? carsArr.join('、') + '車' : '___車';
    
    document.getElementById('carCountBadge').innerText = carCount + ' 車';

    const personCheckboxes = document.querySelectorAll('.person-chk:checked');
    let personCount = personCheckboxes.length;
    
    document.getElementById('personCountBadge').innerText = personCount + ' 人';
    
    let leaderStr = personCount > 0 
        ? (personCheckboxes[0].getAttribute('data-title') + personCheckboxes[0].value) 
        : '___(帶隊官)';

    let grouped = {};
    personCheckboxes.forEach(chk => {
        let title = chk.getAttribute('data-title');
        let name = chk.value;
        if (!grouped[title]) grouped[title] = [];
        grouped[title].push(name);
    });

    let groupStrs = [];
    ['分隊長', '小隊長', '隊員'].forEach(title => {
        if (grouped[title] && grouped[title].length > 0) {
            groupStrs.push(title + grouped[title].join('、'));
        }
    });
    let personsStr = groupStrs.length > 0 ? groupStrs.join('，') + '。' : '無。';

    let textInitial = `中山分隊報告(初報):\n一、本局於${caseTime}受理${address}${dutyType}，派遣中山${carsStr}共${carCount}車${personCount}人，由${leaderStr}帶隊前往。`;
    
    let textFinal = `中山分隊報告(結報):\n一、本局於${caseTime}受理${address}${dutyType}，派遣中山${carsStr}共${carCount}車${personCount}人，由${leaderStr}帶隊前往。\n二、${statusNote}。`;
    
    let textProcess = `中山分隊處理情形：\n一、至${address}執行${dutyType}勤務。\n二、${statusNote}。\n三、出勤車輛:${carsStr}。\n四、出勤人員:${personsStr}`;

    document.getElementById('outputBoxInitial').innerText = textInitial;
    document.getElementById('outputBoxFinal').innerText = textFinal;
    document.getElementById('outputBox').innerText = textProcess;
}

// 複製功能與成功特效
function copyText(boxId, btnId) {
    const outputBox = document.getElementById(boxId);
    navigator.clipboard.writeText(outputBox.innerText).then(() => {
        const btn = document.getElementById(btnId);
        const originalContent = btn.innerHTML;
        
        btn.classList.add('success');
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> 已複製`;
        
        setTimeout(() => {
            btn.classList.remove('success');
            btn.innerHTML = originalContent;
        }, 2000);
    });
}

window.onload = function() {
    initCaseTime();
    updateOutput();
};
</script>
